<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>SVGが消える件の切り分け</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;color:#1a1a1a}
 .page{width:1920px;height:1080px;position:relative;background:#fff;overflow:hidden}
 .a{position:absolute}
 .abs{position:absolute}
 .t36{font-size:36px}
 .lab{font-size:28px;color:#c0392b}
</style></head><body>

<section class="page" data-document-role="page" data-label="S1 現状そのまま">
 <div class="a lab" style="left:100px;top:20px">S1：いま失敗している書き方（class=a／属性のみ／x,y省略あり）</div>
 <svg class="a" style="left:100px;top:70px" width="220" height="64" viewBox="0 0 220 64"><rect width="220" height="64" fill="#c0392b"/></svg>
 <div class="a" style="left:143px;top:82px;font-size:40px;color:#fff">質問</div>
 <svg class="a" style="left:100px;top:200px" width="1720" height="76" viewBox="0 0 1720 76"><rect width="1720" height="76" fill="#f2f2f2"/><rect width="14" height="76" fill="#888"/></svg>
 <div class="a" style="left:140px;top:214px;font-size:44px;font-weight:bold">帯の見出し</div>
 <svg class="a" style="left:100px;top:400px" width="1720" height="130" viewBox="0 0 1720 130">
  <rect x="0" y="0" width="400" height="130" rx="12" fill="#fff" stroke="#555" stroke-width="4"/>
  <rect x="440" y="0" width="400" height="130" rx="12" fill="#fff" stroke="#555" stroke-width="4"/>
 </svg>
 <div class="a t36" style="left:140px;top:445px">① していない</div>
 <div class="a t36" style="left:580px;top:445px">② 1〜2回</div>
</section>

<section class="page" data-document-role="page" data-label="S2 styleに幅高さ">
 <div class="a lab" style="left:100px;top:20px">S2：svgのstyleにも width/height を書く</div>
 <svg class="a" style="left:100px;top:70px;width:220px;height:64px" width="220" height="64" viewBox="0 0 220 64"><rect x="0" y="0" width="220" height="64" fill="#c0392b"/></svg>
 <div class="a" style="left:143px;top:82px;font-size:40px;color:#fff">質問</div>
 <svg class="a" style="left:100px;top:200px;width:1720px;height:76px" width="1720" height="76" viewBox="0 0 1720 76"><rect x="0" y="0" width="1720" height="76" fill="#f2f2f2"/><rect x="0" y="0" width="14" height="76" fill="#888"/></svg>
 <div class="a" style="left:140px;top:214px;font-size:44px;font-weight:bold">帯の見出し</div>
 <svg class="a" style="left:100px;top:400px;width:1720px;height:130px" width="1720" height="130" viewBox="0 0 1720 130">
  <rect x="0" y="0" width="400" height="130" rx="12" fill="#fff" stroke="#555" stroke-width="4"/>
  <rect x="440" y="0" width="400" height="130" rx="12" fill="#fff" stroke="#555" stroke-width="4"/>
 </svg>
 <div class="a t36" style="left:140px;top:445px">① していない</div>
 <div class="a t36" style="left:580px;top:445px">② 1〜2回</div>
</section>

<section class="page" data-document-role="page" data-label="S3 枠は1つずつ別svg">
 <div class="a lab" style="left:100px;top:20px">S3：class=abs／枠ごとに別のsvg／styleにも幅高さ</div>
 <svg class="abs" style="left:100px;top:70px;width:220px;height:64px" width="220" height="64" viewBox="0 0 220 64"><rect x="0" y="0" width="220" height="64" fill="#c0392b"/></svg>
 <div class="abs" style="left:143px;top:82px;font-size:40px;color:#fff">質問</div>
 <svg class="abs" style="left:100px;top:200px;width:1720px;height:76px" width="1720" height="76" viewBox="0 0 1720 76"><rect x="0" y="0" width="1720" height="76" fill="#f2f2f2"/></svg>
 <svg class="abs" style="left:100px;top:200px;width:14px;height:76px" width="14" height="76" viewBox="0 0 14 76"><rect x="0" y="0" width="14" height="76" fill="#888"/></svg>
 <div class="abs" style="left:140px;top:214px;font-size:44px;font-weight:bold">帯の見出し</div>
 <svg class="abs" style="left:100px;top:400px;width:400px;height:130px" width="400" height="130" viewBox="0 0 400 130"><rect x="2" y="2" width="396" height="126" rx="12" fill="#fff" stroke="#555" stroke-width="4"/></svg>
 <svg class="abs" style="left:540px;top:400px;width:400px;height:130px" width="400" height="130" viewBox="0 0 400 130"><rect x="2" y="2" width="396" height="126" rx="12" fill="#fff" stroke="#555" stroke-width="4"/></svg>
 <div class="abs t36" style="left:140px;top:445px">① していない</div>
 <div class="abs t36" style="left:580px;top:445px">② 1〜2回</div>
</section>

<section class="page" data-document-role="page" data-label="S4 divの背景と枠線">
 <div class="a lab" style="left:100px;top:20px">S4：SVGを使わず div の background / border で描く</div>
 <div class="a" style="left:100px;top:70px;width:220px;height:64px;background:#c0392b"></div>
 <div class="a" style="left:143px;top:82px;font-size:40px;color:#fff">質問</div>
 <div class="a" style="left:100px;top:200px;width:1720px;height:76px;background:#f2f2f2;border-left:14px solid #888"></div>
 <div class="a" style="left:140px;top:214px;font-size:44px;font-weight:bold">帯の見出し</div>
 <div class="a" style="left:100px;top:400px;width:400px;height:130px;border:4px solid #555;border-radius:12px"></div>
 <div class="a" style="left:540px;top:400px;width:400px;height:130px;border:4px solid #555;border-radius:12px"></div>
 <div class="a t36" style="left:140px;top:445px">① していない</div>
 <div class="a t36" style="left:580px;top:445px">② 1〜2回</div>
</section>

</body></html>
