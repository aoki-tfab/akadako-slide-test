<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SVG・画像 取り込み検証</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "BIZ UDPGothic", "Yu Gothic", sans-serif; }
  .page { width: 1920px; height: 1080px; position: relative;
          padding: 80px 100px; background: #ffffff; overflow: hidden; }
  .h2   { font-size: 52px; font-weight: bold; background: #f2f2f2;
          border-left: 14px solid #888888; padding: 18px 28px; margin-bottom: 40px; }
  .note { font-size: 34px; color: #666666; margin-top: 30px; }
  .lbl-div  { font-size: 40px; color:#fff; background:#d9534f; padding:10px 34px; width: 220px; text-align:center; }
  .lbl-h    { font-size: 40px; color:#fff; background:#2e7d32; padding:10px 34px; width: 220px; text-align:center; }
  .box  { width: 380px; height: 200px; border: 6px solid #444; border-radius: 16px;
          display:flex; align-items:center; justify-content:center;
          font-size: 42px; font-weight:bold; text-align:center; background:#fafafa; }
  .row  { display:flex; align-items:center; gap: 40px; margin-top: 40px; }
  img   { border: 4px solid #cccccc; }
</style>
</head>
<body>

<!-- A: 図解まるごと1枚のSVG -->
<section class="page" data-document-role="page" data-label="A_SVGで図解全体"
         data-speaker-notes="検証A：図解をまるごとSVGで描いた場合、編集可能な図形として入るか。">
  <div class="h2">A：図解まるごとSVG</div>
  <svg width="1720" height="620" viewBox="0 0 1720 620" xmlns="http://www.w3.org/2000/svg">
    <rect x="20"  y="220" width="380" height="200" rx="16" fill="#fafafa" stroke="#444444" stroke-width="6"/>
    <text x="210" y="305" font-size="42" font-weight="bold" text-anchor="middle" fill="#111">はかる係</text>
    <text x="210" y="365" font-size="36" text-anchor="middle" fill="#111">送るだけ</text>
    <rect x="670" y="220" width="380" height="200" rx="16" fill="#ffe9c7" stroke="#d08000" stroke-width="6"/>
    <text x="860" y="305" font-size="42" font-weight="bold" text-anchor="middle" fill="#c25e00">きめる係</text>
    <text x="860" y="365" font-size="36" text-anchor="middle" fill="#111">判断する</text>
    <rect x="1320" y="220" width="380" height="200" rx="16" fill="#fafafa" stroke="#444444" stroke-width="6"/>
    <text x="1510" y="305" font-size="42" font-weight="bold" text-anchor="middle" fill="#111">うごく係</text>
    <text x="1510" y="365" font-size="36" text-anchor="middle" fill="#111">受けて動くだけ</text>
    <polygon points="430,300 590,300 590,270 650,320 590,370 590,340 430,340" fill="#3d3d3d"/>
    <polygon points="1080,300 1240,300 1240,270 1300,320 1240,370 1240,340 1080,340" fill="#3d3d3d"/>
    <path d="M700 60 h520 a16 16 0 0 1 16 16 v100 a16 16 0 0 1 -16 16 h-360 l-40 50 l-10 -50 h-110 a16 16 0 0 1 -16 -16 v-100 a16 16 0 0 1 16 -16 z"
          fill="#eaf4ff" stroke="#3a7bd5" stroke-width="4"/>
    <text x="960" y="140" font-size="38" text-anchor="middle" fill="#14385f">判断しているのは、まん中の1台だけ</text>
  </svg>
</section>

<!-- B: HTMLの箱 + SVGの矢印だけ -->
<section class="page" data-document-role="page" data-label="B_HTML箱とSVG矢印の混在"
         data-speaker-notes="検証B：箱はHTML、矢印だけSVGにした場合。">
  <div class="h2">B：HTMLの箱＋SVGの矢印</div>
  <div class="row">
    <div class="box">はかる係<br>送るだけ</div>
    <svg width="220" height="100" viewBox="0 0 220 100"><polygon points="0,35 150,35 150,5 220,50 150,95 150,65 0,65" fill="#3d3d3d"/></svg>
    <div class="box">きめる係<br>判断する</div>
    <svg width="220" height="100" viewBox="0 0 220 100"><polygon points="0,35 150,35 150,5 220,50 150,95 150,65 0,65" fill="#3d3d3d"/></svg>
    <div class="box">うごく係<br>受けて動くだけ</div>
  </div>
  <div class="note">箱がHTML要素のまま、矢印だけ図形になるかを見る。</div>
</section>

<!-- C: 外部PNG（スクショ相当） -->
<section class="page" data-document-role="page" data-label="C_外部PNG"
         data-speaker-notes="検証C：相対パスの外部PNGが画像として取り込まれるか。機種差し替えの要。">
  <div class="h2">C：外部PNG（スクショ相当）</div>
  <img src="shot.png" width="1200" alt="アプリ画面のスクリーンショット">
  <div class="note">実際の教材ではこの位置に機種ごとのスクショが入る。asset_id が振られるかも確認する。</div>
</section>

<!-- D: ラベルの書き方3種 -->
<section class="page" data-document-role="page" data-label="D_ラベルの書き方"
         data-speaker-notes="検証D：前回 span のラベルが他ページに複製された。書き方で防げるか。">
  <div class="h2">D：ラベルの書き方で複製が起きるか</div>
  <div class="lbl-div">div のラベル</div>
  <div class="note">上は div。下は h3。前回は span で複製が起きた。</div>
  <h3 class="lbl-h">h3 のラベル</h3>
  <div class="note">このページにしか無いはずのラベルが、他ページに現れないかを確認する。</div>
</section>

</body>
</html>
