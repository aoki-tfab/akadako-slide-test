<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>SVGを使わずに枠を描く</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;color:#1a1a1a}
 .page{width:1920px;height:1080px;position:relative;background:#fff;overflow:hidden}
 .a{position:absolute}
 .t36{font-size:36px}
 .lab{font-size:28px;color:#c0392b}
</style></head><body>

<section class="page" data-document-role="page" data-label="枠のdiv案">
 <div class="a lab" style="left:60px;top:20px">D：divで枠を描けるか（SVGを使わない）</div>

 <div class="a t36" style="left:60px;top:90px">D1 白背景＋border</div>
 <div class="a" style="left:500px;top:80px;width:400px;height:120px;background:#fff;border:4px solid #555;border-radius:12px"></div>
 <div class="a t36" style="left:540px;top:120px">① していない</div>

 <div class="a t36" style="left:60px;top:250px">D2 薄い背景＋border</div>
 <div class="a" style="left:500px;top:240px;width:400px;height:120px;background:#fafafa;border:4px solid #555;border-radius:12px"></div>
 <div class="a t36" style="left:540px;top:280px">② 1〜2回</div>

 <div class="a t36" style="left:60px;top:410px">D3 背景なし＋border</div>
 <div class="a" style="left:500px;top:400px;width:400px;height:120px;border:4px solid #555;border-radius:12px"></div>
 <div class="a t36" style="left:540px;top:440px">③ 3〜5回</div>

 <div class="a t36" style="left:60px;top:570px">D4 白背景＋outline</div>
 <div class="a" style="left:500px;top:560px;width:400px;height:120px;background:#fff;outline:4px solid #555"></div>
 <div class="a t36" style="left:540px;top:600px">④ 6回以上</div>

 <div class="a t36" style="left:60px;top:730px">D5 白背景＋box-shadow</div>
 <div class="a" style="left:500px;top:720px;width:400px;height:120px;background:#fff;box-shadow:0 0 0 4px #555;border-radius:12px"></div>
 <div class="a t36" style="left:540px;top:760px">⑤ 影で枠</div>

 <div class="a t36" style="left:60px;top:890px">D6 色ベタ2枚を重ねて枠</div>
 <div class="a" style="left:500px;top:880px;width:400px;height:120px;background:#555;border-radius:12px"></div>
 <div class="a" style="left:504px;top:884px;width:392px;height:112px;background:#fff;border-radius:9px"></div>
 <div class="a t36" style="left:540px;top:920px">⑥ 重ねて枠</div>

 <div class="a t36" style="left:1050px;top:90px">D7 注意ボックス</div>
 <div class="a" style="left:1050px;top:140px;width:760px;height:150px;background:#fff8e6;border:4px solid #d08000;border-radius:14px"></div>
 <div class="a" style="left:1090px;top:170px;font-size:30px;color:#c25e00">注意</div>
 <div class="a t36" style="left:1090px;top:215px">かんたんなIDにすると混ざる。</div>

 <div class="a t36" style="left:1050px;top:340px">D8 矢印（SVG 1個だけ）</div>
 <svg class="a" style="left:1050px;top:390px" width="760" height="140" viewBox="0 0 760 140"><polygon points="0,40 500,40 500,10 620,70 500,130 500,100 0,100" fill="#3d3d3d"/></svg>
</section>

</body></html>
